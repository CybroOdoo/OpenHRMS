name: Odoo + testRigor E2E

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: odoo
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U odoo -d odoo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: odoo
      PGPASSWORD: odoo
      PGDATABASE: odoo

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Show Python being used
        run: |
          which python
          python --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget git python3-dev libxml2-dev libxslt1-dev zlib1g-dev \
            libsasl2-dev libldap2-dev build-essential libssl-dev libffi-dev libpq-dev \
            wkhtmltopdf xfonts-75dpi xfonts-base

      - name: Download Odoo 14
        run: |
          git clone --depth 1 --branch 14.0 https://github.com/odoo/odoo.git odoo-14.0

      - name: Install Odoo Python deps
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r odoo-14.0/requirements.txt
          python -m pip install pdfminer.six psycopg2-binary

      - name: Prepare custom addons
        shell: bash
        run: |
          set -e
          mkdir -p odoo-14.0/custom_addons
          # If you keep modules in a top-level custom_addons dir, sync them in
          if [ -d "custom_addons" ]; then
            rsync -a --delete custom_addons/ odoo-14.0/custom_addons/
          fi
          shopt -s nullglob
          # COPY ALL EXPECTED PREFIXES (added: oh_*)
          for d in hrms_* hr_* ohrms_* openhrms_* oh_*; do
            if [ -d "$d" ]; then
              cp -r "$d" odoo-14.0/custom_addons/
            fi
          done
          echo "Custom addons copied:"
          ls -1 odoo-14.0/custom_addons || true

      - name: Create odoo.conf
        run: |
          cat > odoo.conf <<'EOF'
          [options]
          admin_passwd = admin
          db_host = localhost
          db_port = 5432
          db_user = odoo
          db_password = odoo
          addons_path = odoo-14.0/odoo/addons,~/.local/share/Odoo/addons/14.0,odoo-14.0/addons,odoo-14.0/custom_addons
          xmlrpc_port = 8080
          logfile = odoo.log
          log_level = info
          limit_time_cpu = 600
          limit_time_real = 1200
          workers = 0
          EOF

      - name: Ensure DB exists
        run: |
          PGPASSWORD=odoo psql -h "$PGHOST" -U "$PGUSER" -tc "SELECT 1 FROM pg_database WHERE datname='odoo'" | grep -q 1 || \
            PGPASSWORD=odoo createdb -h "$PGHOST" -U "$PGUSER" odoo

      - name: "#1 Initialize base only (no server yet)"
        run: |
          python odoo-14.0/odoo-bin -c odoo.conf -d odoo \
            -i base --without-demo=all --load-language=en_US --stop-after-init

      - name: Select installable addons (exclude hr_reminder & reverse-deps; curated list)
        id: depfilter
        run: |
          ROOT="odoo-14.0/custom_addons"
          rm -rf "$ROOT/hr_reminder" || true

          python - <<'PY'
          import ast, os
          ROOT = "odoo-14.0/custom_addons"
          BAD = {"hr_reminder"}
          # Your curated list (leave deps to Odoo to resolve, we just need them present):
          WANTED = ["ohrms_core", "hr_payroll_community", "hr_payroll_account_community", "hr_employee_updation", "hr_resignation"]

          manifests, deps = {}, {}
          if os.path.isdir(ROOT):
              for d in os.listdir(ROOT):
                  p = os.path.join(ROOT, d)
                  if not os.path.isdir(p): continue
                  mf = None
                  for fn in ("__manifest__.py","__openerp__.py"):
                      f = os.path.join(p, fn)
                      if os.path.isfile(f): mf = f; break
                  if not mf: continue
                  try:
                      data = ast.literal_eval(open(mf, encoding="utf-8").read())
                  except Exception:
                      continue
                  manifests[d] = data
                  deps[d] = set(data.get("depends", []))

          rdeps = {m:set() for m in manifests}
          for m, ds in deps.items():
              for d in ds:
                  if d in rdeps:
                      rdeps[d].add(m)

          to_skip = set()
          stack = list(BAD)
          while stack:
              b = stack.pop()
              if b in to_skip: continue
              to_skip.add(b)
              stack.extend(sorted(rdeps.get(b, ())))

          install = [m for m in WANTED if m in manifests and m not in to_skip]

          print("Skipping:", ", ".join(sorted(to_skip)) or "(none)")
          print("Install list:", ", ".join(install) or "(empty)")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("install=" + ","".join(install) + "\n")
          PY

      - name: Install OpenHRMS (filtered)
        if: ${{ steps.depfilter.outputs.install != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Installing: ${{ steps.depfilter.outputs.install }}"

          # Sanity: check each addon exists in either core or custom
          missing=0
          IFS=',' read -ra mods <<< "${{ steps.depfilter.outputs.install }}"
          for m in "${mods[@]}"; do
            if [ ! -d "odoo-14.0/custom_addons/$m" ] && [ ! -d "odoo-14.0/addons/$m" ] && [ ! -d "odoo-14.0/odoo/addons/$m" ]; then
              echo "::error::Addon '$m' not found in addons paths"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Available custom addons:"
            ls -1 odoo-14.0/custom_addons || true
            exit 2
          fi

          set +e
          python odoo-14.0/odoo-bin -c odoo.conf -d odoo \
            -i "${{ steps.depfilter.outputs.install }}" --without-demo=all --stop-after-init
          rc=$?
          echo "==== Tail of odoo.log (post-install) ===="
          tail -n 300 odoo.log || true
          if [ $rc -ne 0 ]; then
            echo "==== ERROR/CRITICAL lines from odoo.log ===="
            (grep -nE "ERROR|CRITICAL|Traceback" odoo.log || true)
            exit $rc
          fi

      - name: Start Odoo server (background, log to file)
        run: |
          python odoo-14.0/odoo-bin -c odoo.conf -d odoo > odoo.log 2>&1 &
          echo $! > odoo.pid
          sleep 5
          echo "Odoo PID: $(cat odoo.pid)"

      - name: Wait for Odoo to be ready
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/web/login | grep -qi "Odoo"; then
              echo "Odoo is up!"
              exit 0
            fi
            echo "Waiting for Odoo..."
            sleep 5
          done
          echo "Odoo did not start in time."
          echo "==== Last 200 lines of odoo.log ===="
          tail -n 200 odoo.log || true
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install testRigor CLI
        run: npm install -g testrigor-cli

      - name: Show testRigor CLI version
        run: testrigor --version

      - name: Run testRigor E2E tests
        run: >
          testrigor test-suite run
          ${{ vars.TESTRIGOR_SUITE_ID }}
          --token ${{ secrets.TESTRIGOR_TOKEN }}
          --localhost
          --url http://localhost:8080
          --junit-report-save-path ./testrigor-report.xml

      - name: Upload testRigor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testrigor-report
          path: ./testrigor-report.xml

      - name: Upload Odoo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-logs
          path: ./odoo.log
