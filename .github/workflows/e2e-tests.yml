name: Odoo CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U odoo -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: odoo
      PGPASSWORD: odoo
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpq-dev python3-dev libsasl2-dev libldap2-dev libssl-dev \
            wkhtmltopdf xfonts-75dpi xfonts-base \
            nodejs npm

      - name: Get Odoo 14 (if not present)
        run: |
          if [ ! -d odoo-14.0 ]; then
            git clone --depth=1 --branch 14.0 https://github.com/odoo/odoo.git odoo-14.0
          fi

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r odoo-14.0/requirements.txt
          # Quiet the PDF indexation warning; DB driver:
          pip install pdfminer.six psycopg2-binary

      - name: Prepare addons folder
        run: |
          mkdir -p odoo-14.0/custom_addons
          # If your repo already has custom_addons/ at the root, copy them in:
          if [ -d "custom_addons" ]; then
            rsync -a --delete custom_addons/ odoo-14.0/custom_addons/
          fi

      - name: Create odoo.conf
        run: |
          cat > odoo.conf <<'CFG'
          [options]
          admin_passwd = admin
          db_host = localhost
          db_port = 5432
          db_user = odoo
          db_password = odoo
          logfile = odoo.log
          addons_path = odoo-14.0/odoo/addons,~/.local/share/Odoo/addons/14.0,odoo-14.0/addons,odoo-14.0/custom_addons
          limit_time_cpu = 600
          limit_time_real = 1200
          workers = 0
          CFG

      - name: Wait for Postgres and ensure role
        run: |
          for i in {1..30}; do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; then
              break
            fi
            sleep 2
          done
          psql -v ON_ERROR_STOP=1 -c "CREATE USER odoo WITH PASSWORD 'odoo' CREATEDB;" || true
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE odoo WITH SUPERUSER;" || true

      - name: "# 1) Create DB + base first"
        run: |
          python odoo-14.0/odoo-bin -c odoo.conf -d odoo \
            -i base --without-demo=all --load-language=en_US --stop-after-init

      # === Change 1: compute a safe install list, excluding hr_reminder and its reverse deps ===
      - name: Select installable addons (exclude hr_reminder and reverse deps)
        id: depfilter
        run: |
          ROOT="odoo-14.0/custom_addons"
          # Belt & suspenders: remove the problematic addon if present
          rm -rf "$ROOT/hr_reminder" || true

          python - <<'PY'
          import ast, os
          ROOT = "odoo-14.0/custom_addons"
          BAD = {"hr_reminder"}  # modules to exclude (plus everything that depends on them)

          manifests, deps, rdeps = {}, {}, {}
          if not os.path.isdir(ROOT):
              print("No custom_addons dir; nothing to install.")
          else:
              for d in os.listdir(ROOT):
                  p = os.path.join(ROOT, d)
                  if not os.path.isdir(p): continue
                  mf = None
                  for fn in ("__manifest__.py","__openerp__.py"):
                      f = os.path.join(p, fn)
                      if os.path.isfile(f):
                          mf = f; break
                  if not mf: continue
                  try:
                      data = ast.literal_eval(open(mf, encoding="utf-8").read())
                  except Exception:
                      continue
                  manifests[d] = data
                  deps[d] = set(data.get("depends", []))

              rdeps = {m:set() for m in manifests}
              for m, ds in deps.items():
                  for d in ds:
                      if d in rdeps:
                          rdeps[d].add(m)

              # find everything that (transitively) depends on BAD
              to_skip = set()
              stack = list(BAD)
              while stack:
                  b = stack.pop()
                  if b in to_skip: continue
                  to_skip.add(b)
                  stack.extend(sorted(rdeps.get(b, ())))

              # Curated set we want to install; hr_employee_updation is intentionally omitted
              wanted = ["ohrms_core", "hr_payroll_community", "hr_payroll_account_community", "hr_resignation"]
              install = [m for m in wanted if m in manifests and m not in to_skip]

              print("Skipping (reverse-deps of hr_reminder):", ", ".join(sorted(to_skip)) or "(none)")
              print("Install list:", ", ".join(install) or "(empty)")

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("install=" + ",".join(install) + "\n")
          PY

      # === Change 2: install only that safe list; remove any broad/bulk installs ===
      - name: Install OpenHRMS (filtered)
        if: ${{ steps.depfilter.outputs.install != '' }}
        run: |
          echo "Installing: ${{ steps.depfilter.outputs.install }}"
          python odoo-14.0/odoo-bin -c odoo.conf -d odoo \
            -i "${{ steps.depfilter.outputs.install }}" --without-demo=all --stop-after-init

      - name: Done
        run: echo "Setup finished."
