name: testRigor E2E Tests

on:
  push:
    branches:
      - "**"

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: odoo
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U odoo -d odoo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Show Python being used
        run: |
          which python
          python --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git python3-dev libxml2-dev libxslt1-dev zlib1g-dev \
            libsasl2-dev libldap2-dev build-essential libssl-dev libffi-dev libpq-dev

      - name: Install Odoo dependencies (into this Python)
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r https://raw.githubusercontent.com/odoo/odoo/14.0/requirements.txt
          # Dashboard commonly needs pandas
          python -m pip install "pandas==1.5.3"

      - name: Download Odoo 14
        run: |
          git clone --depth 1 --branch 14.0 https://github.com/odoo/odoo.git odoo-14.0

      # Copy vendored OpenHRMS addons from THIS repo.
      # Include payroll & related, plus hr_* (for hr_resignation/hr_employee_updation), but we'll blocklist later.
      - name: Place OpenHRMS modules (repo-vendored)
        run: |
          mkdir -p odoo-14.0/custom_addons
          shopt -s nullglob
          for pat in 'hrms_*' 'ohrms_*' 'oh_*' 'hr_payroll_*' 'hr_*'; do
            for d in $pat; do
              if [ -d "$d" ]; then
                echo "Copying $d"
                cp -r "$d" odoo-14.0/custom_addons/
              fi
            done
          done
          echo "Custom addons (from repo):"
          ls -1 odoo-14.0/custom_addons || true

      # Fallback fetch for critical deps if they weren't vendored
      - name: Ensure required OpenHRMS dependencies (fallback fetch v14)
        run: |
          need_copy=()
          for m in hr_payroll_community hr_payroll_account_community hr_employee_updation hr_resignation ohrms_core; do
            [ -d "odoo-14.0/custom_addons/$m" ] || need_copy+=("$m")
          done
          if [ ${#need_copy[@]} -gt 0 ]; then
            echo "Missing addons: ${need_copy[*]} — fetching from v14 fork"
            git clone --depth 1 --branch 14.0 https://github.com/odoochain/odoo-openhrms.git /tmp/openhrms14
            for m in "${need_copy[@]}"; do
              if [ -d "/tmp/openhrms14/$m" ]; then
                echo "Adding $m"
                cp -r "/tmp/openhrms14/$m" "odoo-14.0/custom_addons/"
              else
                echo "WARNING: $m not found in fallback repo"
              fi
            done
          fi
          echo "Final addons:"
          ls -1 odoo-14.0/custom_addons || true

      - name: Write Odoo configuration
        run: |
          cat > odoo.conf <<'EOF'
          [options]
          admin_passwd = admin
          addons_path = odoo-14.0/addons,odoo-14.0/custom_addons
          db_host = localhost
          db_port = 5432
          db_user = odoo
          db_password = odoo
          xmlrpc_port = 8080
          log_level = info
          EOF

      - name: Resolve OpenHRMS module list
        id: mods
        run: |
          python - <<'PY'
          import os
          root = 'odoo-14.0/custom_addons'
          mods = []
          if os.path.isdir(root):
            for d in sorted(os.listdir(root)):
              p = os.path.join(root, d)
              if os.path.isdir(p) and (os.path.isfile(os.path.join(p, '__manifest__.py')) or os.path.isfile(os.path.join(p, '__openerp__.py'))):
                mods.append(d)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('mods=' + ','.join(mods) + '\n')
          print("Modules:", ','.join(mods))
          PY

      # >>> NEW: blocklist incompatible addons for Odoo 14 (prevents hr_reminder crash)
      - name: Filter incompatible addons
        id: keep
        env:
          ALL_MODS: ${{ steps.mods.outputs.mods }}
        run: |
          BLOCKLIST=("hr_reminder")
          IFS=',' read -ra arr <<< "$ALL_MODS"
          kept=()
          for m in "${arr[@]}"; do
            skip=0
            for b in "${BLOCKLIST[@]}"; do
              if [ "$m" = "$b" ]; then
                echo "Excluding incompatible addon: $m"
                skip=1
                break
              fi
            done
            [ $skip -eq 0 ] && kept+=("$m")
          done
          echo "mods=$(IFS=,; echo "${kept[*]}")" >> "$GITHUB_OUTPUT"
          echo "Installing addons: $(IFS=,; echo "${kept[*]}")"

      - name: Initialize DB & install OpenHRMS modules (headless)
        env:
          FILTERED_MODS: ${{ steps.keep.outputs.mods }}
        run: |
          # 1) Create DB + base first
          python odoo-14.0/odoo-bin -c odoo.conf -d odoo \
            -i base --without-demo=all --load-language=en_US --stop-after-init

          # 2) Pre-install core deps if present
          CORE=(ohrms_core hr_payroll_community hr_payroll_account_community hr_employee_updation hr_resignation)
          EXISTING_CORE=()
          for m in "${CORE[@]}"; do
            [ -d "odoo-14.0/custom_addons/$m" ] && EXISTING_CORE+=("$m")
          done
          if [ ${#EXISTING_CORE[@]} -gt 0 ]; then
            echo "Pre-installing core: ${EXISTING_CORE[*]}"
            python odoo-14.0/odoo-bin -c odoo.conf -d odoo \
              -i "$(IFS=, ; echo "${EXISTING_CORE[*]}")" --without-demo=all --stop-after-init
          fi

          # 3) Install the filtered set (already-installed ones are skipped)
          if [ -n "$FILTERED_MODS" ]; then
            python odoo-14.0/odoo-bin -c odoo.conf -d odoo \
              -i "$FILTERED_MODS" --without-demo=all --stop-after-init
          else
            echo "No custom addons to install after filtering; proceeding with base only."
          fi

      - name: Start Odoo server (log to file)
        run: |
          python odoo-14.0/odoo-bin -c odoo.conf -d odoo > odoo.log 2>&1 &
          echo $! > odoo.pid
          sleep 5
          echo "Odoo PID: $(cat odoo.pid)"

      - name: Wait for Odoo to be ready
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/web/login | grep -qi "Odoo"; then
              echo "Odoo is up!"
              exit 0
            fi
            echo "Waiting for Odoo..."
            sleep 5
          done
          echo "Odoo did not start in time."
          echo "==== Last 200 lines of odoo.log ===="
          tail -n 200 odoo.log || true
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install testRigor CLI
        run: npm install -g testrigor-cli

      - name: Show testRigor CLI version
        run: testrigor --version

      - name: Run testRigor E2E tests
        run: >
          testrigor test-suite run ${{ vars.TESTRIGOR_SUITE_ID }}
          --token ${{ secrets.TESTRIGOR_TOKEN }}
          --localhost
          --url http://localhost:8080
          --junit-report-save-path ./testrigor-report.xml

      - name: Upload testRigor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testrigor-report
          path: ./testrigor-report.xml

      - name: Upload Odoo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-logs
          path: ./odoo.log
