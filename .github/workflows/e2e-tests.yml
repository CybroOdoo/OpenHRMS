name: testRigor E2E Tests

on:
  push:
    branches:
      - '**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Build a local Odoo 14 image that already has pandas installed
      # (avoids module install failures due to missing pandas)
      - name: Build local odoo:14.0 with pandas
        shell: bash
        run: |
          set -euo pipefail
          cat > Dockerfile.odoo14 <<'EOF'
          FROM odoo:14.0
          USER root
          RUN python3 -m pip install --upgrade pip && \
              pip3 install "pandas==1.5.3"
          USER odoo
          EOF
          docker build -f Dockerfile.odoo14 -t odoo:14.0 .

      - name: Ensure setup_openhrms.sh is executable
        run: chmod +x ./setup_openhrms.sh

      # Run your indexed installer script. We pass env vars commonly honored by such scripts.
      # Even if the script ignores them, our locally built odoo:14.0 tag is already used.
      - name: Run OpenHRMS installer (Docker)
        env:
          HOST_HTTP_PORT: "8080"       # tests expect :8080
          PG_IMAGE: "postgres:13"      # preferred PG version
          ODOO_IMAGE: "odoo:14.0"      # use the locally-built image w/ pandas
          OPENHRMS_BRANCH: "14.0"
        run: |
          set -euo pipefail
          sudo ./setup_openhrms.sh

      - name: Show running containers
        run: docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}'

      - name: Wait for Odoo to be ready on :8080
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..120}; do  # up to ~10 minutes (pull + init can take time)
            if curl -fsS "http://localhost:8080/web/login" | grep -qi "Odoo"; then
              echo "Odoo is up!"
              exit 0
            fi
            echo "Waiting for Odoo..."
            sleep 5
          done
          echo "Odoo did not start in time."
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install testRigor CLI
        run: npm install -g testrigor-cli

      - name: Show testRigor CLI version
        run: testrigor --version

      - name: Run testRigor E2E tests
        run: >
          testrigor test-suite run
          ${{ vars.TESTRIGOR_SUITE_ID }}
          --token ${{ secrets.TESTRIGOR_TOKEN }}
          --localhost
          --url http://localhost:8080
          --junit-report-save-path ./testrigor-report.xml

      - name: Gather Odoo logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Try the script's log path if it uses a mounted volume
          if [[ -f /opt/openhrms/logs/openhrms.log ]]; then
            sudo cp /opt/openhrms/logs/openhrms.log ./odoo.log || true
          fi
          # Fallback: capture docker logs from the Odoo container bound to :8080 or image odoo:14.0
          if [[ ! -s ./odoo.log ]]; then
