name: testRigor E2E Tests

on:
  push:
    branches:
      - "**"

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: odoo
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'   

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git python3-pip python3-dev libxml2-dev libxslt1-dev zlib1g-dev libsasl2-dev libldap2-dev build-essential libssl-dev libffi-dev libpq-dev

      - name: Install Odoo dependencies
        run: |
          pip install wheel
          pip install -r https://raw.githubusercontent.com/odoo/odoo/14.0/requirements.txt

      - name: Download Odoo
        run: |
          git clone --depth 1 --branch 14.0 https://www.github.com/odoo/odoo.git odoo-14.0

      - name: Install OpenHRMS modules
        run: |
          mkdir -p odoo-14.0/custom_addons
          cp -r hrms_* odoo-14.0/custom_addons/

      - name: Create Odoo Database (if not exists)
        run: |
          PGPASSWORD=odoo psql -h localhost -U odoo -c "CREATE DATABASE odoo;" || echo "DB already exists"

      - name: Start Odoo server
        run: |
          python3 odoo-14.0/odoo-bin \
          --addons-path=odoo-14.0/addons,odoo-14.0/custom_addons \
          --db_host=localhost \
          --db_user=odoo \
          --db_password=odoo \
          --xmlrpc-port=8080 \
          --log-level=info &
          sleep 30

      - name: Wait for Odoo to be ready
        run: |
          for i in {1..30}; do
            if curl -sS http://localhost:8080 | grep -q "Odoo"; then
              echo "Odoo is up!"
              exit 0
            fi
            echo "Waiting for Odoo..."
            sleep 5
          done
          echo "Odoo did not start in time."
          exit 1

      - name: Install testRigor CLI
        run: pip install testrigor

      - name: Run testRigor E2E tests
        run: testrigor test-suite run ${{ vars.TESTRIGOR_SUITE_ID }} --token ${{ secrets.TESTRIGOR_TOKEN }} --url=http://localhost:8080